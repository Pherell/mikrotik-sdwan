# Development overlay: hot reload, the API exposed directly, and no Caddy.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    environment:
      SDWAN_ENV: dev
      SDWAN_DEBUG: "true"
      SDWAN_CORS_ORIGINS: http://localhost:5173
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "8000:8000"

  worker:
    volumes:
      - ./backend/app:/app/app:ro

  # Run the UI with `npm run dev` on the host instead; Vite proxies /api to the
  # exposed API above.
  ui:
    profiles: ["never"]
  caddy:
    profiles: ["never"]
