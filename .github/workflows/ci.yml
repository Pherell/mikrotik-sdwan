name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new advisory against a pinned dependency surfaces without
    # waiting for someone to push.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is Debian 12 bookworm, the oldest supported. 3.12 is what the
        # container runs. Both must pass or the support claim is fiction.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run lint
      - name: Build
        working-directory: ui
        run: npm run build

  docker:
    # The stack has never been run by its author on a machine with Docker.
    # This at least proves the images build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t sdwan-api ./backend
      - name: Build UI image
        run: docker build -t sdwan-ui ./ui
      - name: Build softhub image
        run: docker build -t sdwan-softhub ./softhub
      - name: Validate compose
        env: &stack_env
          POSTGRES_PASSWORD: ci
          SDWAN_SECRET_KEY: ci-secret-key-at-least-32-characters
          SDWAN_JWT_SECRET: ci-jwt-secret-at-least-32-characters
          SDWAN_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.softhub.yml config --quiet

      # Building the images proves they compile. Only running them proves the
      # stack starts -- which is how SDWAN_CORS_ORIGINS broke every deployment
      # while the whole suite was green.
      - name: Start the stack
        env: *stack_env
        run: docker compose up -d --wait --wait-timeout 180

      - name: Migrations completed
        env: *stack_env
        run: |
          code=$(docker compose ps -a --format json migrate | jq -r '.ExitCode // 1')
          docker compose logs migrate --no-log-prefix
          test "$code" = "0" || { echo "::error::migrate exited $code"; exit 1; }

      - name: API answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::/healthz never answered"
          exit 1

      - name: Bootstrap admin can log in
        env: *stack_env
        run: |
          token=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login             -H 'Content-Type: application/json'             -d '{"email":"admin@local","password":"ci-bootstrap-password"}'             | jq -r .access_token)
          test -n "$token" && test "$token" != "null" || {
            echo "::error::login returned no token"; exit 1; }
          curl -fsS http://localhost:8080/api/v1/sites             -H "Authorization: Bearer $token" | jq -e 'type == "array"'

      - name: Logs on failure
        if: failure()
        env: *stack_env
        run: docker compose logs --no-log-prefix --tail 100

      - name: Tear down
        if: always()
        env: *stack_env
        run: docker compose down -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency advisories
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # Reported, not fatal: a transitive advisory with no fix available
          # should not block a security fix from merging.
          pip-audit --strict || echo "::warning::pip-audit reported findings"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Node dependency advisories
        working-directory: ui
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"
