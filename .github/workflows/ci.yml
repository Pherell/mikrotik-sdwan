name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new advisory against a pinned dependency surfaces without
    # waiting for someone to push.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is Debian 12 bookworm, the oldest supported. 3.12 is what the
        # container runs. Both must pass or the support claim is fiction.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run lint
      - name: Build
        working-directory: ui
        run: npm run build

  docker:
    # The stack has never been run by its author on a machine with Docker.
    # This at least proves the images build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t sdwan-api ./backend
      - name: Build UI image
        run: docker build -t sdwan-ui ./ui
      - name: Build softhub image
        run: docker build -t sdwan-softhub ./softhub
      - name: Validate compose
        env: &stack_env
          POSTGRES_PASSWORD: ci
          SDWAN_SECRET_KEY: ci-secret-key-at-least-32-characters
          SDWAN_JWT_SECRET: ci-jwt-secret-at-least-32-characters
          SDWAN_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password
          # Deliberately NOT the shipped default of 80/443. Non-standard ports
          # are where Caddy's redirect and certificate selection actually go
          # wrong, so that is the case worth exercising on every push.
          HTTP_PORT: 8080
          HTTPS_PORT: 8443
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.softhub.yml config --quiet
          # And again without the overrides, so the defaults .env.example ships
          # with are validated too.
          env -u HTTP_PORT -u HTTPS_PORT docker compose config --quiet

      # Building the images proves they compile. Only running them proves the
      # stack starts -- which is how SDWAN_CORS_ORIGINS broke every deployment
      # while the whole suite was green.
      - name: Start the stack
        env: *stack_env
        run: docker compose up -d --wait --wait-timeout 180

      - name: Migrations completed
        env: *stack_env
        run: |
          code=$(docker compose ps -a --format json migrate | jq -r '.ExitCode // 1')
          docker compose logs migrate --no-log-prefix
          test "$code" = "0" || { echo "::error::migrate exited $code"; exit 1; }

      # -k because SDWAN_DOMAIN is localhost, so the certificate is signed by
      # Caddy's internal CA. The body is checked, not just the exit status:
      # curl -f treats a 308 as success and hands back an empty body, so this
      # step used to pass while every request was being redirected into a port
      # nothing was listening on.
      - name: API answers over HTTPS
        env: *stack_env
        run: |
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost:8443/healthz | jq -e '.status == "ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::/healthz never answered"
          docker compose logs caddy api --no-log-prefix --tail 50
          exit 1

      # Caddy builds its redirect from the port it is listening on, so a
      # published port that differs from the bound one sends browsers to a
      # closed door. This asserts the port survives the redirect.
      - name: HTTP redirects to HTTPS on the published port
        run: |
          location=$(curl -sSI http://localhost:8080/ | tr -d '\r' \
            | awk 'tolower($1) == "location:" { print $2 }')
          echo "redirect -> $location"
          case "$location" in
            https://localhost:8443/*) ;;
            *) echo "::error::expected https://localhost:8443/..., got '$location'"
               exit 1 ;;
          esac

      - name: Bootstrap admin can log in
        env: *stack_env
        run: |
          token=$(curl -fsSk -X POST https://localhost:8443/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@local","password":"ci-bootstrap-password"}' \
            | jq -r .access_token)
          test -n "$token" && test "$token" != "null" || {
            echo "::error::login returned no token"; exit 1; }
          curl -fsSk https://localhost:8443/api/v1/sites \
            -H "Authorization: Bearer $token" | jq -e 'type == "array"'

      - name: Logs on failure
        if: failure()
        env: *stack_env
        run: docker compose logs --no-log-prefix --tail 100

      - name: Tear down
        if: always()
        env: *stack_env
        run: docker compose down -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python dependency advisories
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # Reported, not fatal: a transitive advisory with no fix available
          # should not block a security fix from merging.
          pip-audit --strict || echo "::warning::pip-audit reported findings"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Node dependency advisories
        working-directory: ui
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"
